# SMAC3 autotuning of Intel's Distribution for LINPACK (MKL mp_linpack,
# xhpl_intel64_dynamic) on the Launchpad node, driven by hpl_autotune.py
# (IntelHPLApplication): Intel's documented launch variables, a NUMA
# memory-policy knob, up to 8 ranks, a small N band for fast sweeps, the uncore
# frequency cap, and Intel HPL's environment knobs (HPL_HT, HPL_NUMTHREADS,
# HPL_PAIR, HPL_UMODE, HPL_SWAPWIDTH, HPL_SWAPTHRESHOLD, HPL_LARGEPAGE).
# The spack netlib-HPL setup is hpl_netlib_smac3.yaml.
#
# Lineage: smac3_intel_hpl (small N, 3 grids) -> smac3_intel_hpl_v2 (N up
# to ~329k, no uncore cap or env knobs) -> smac3_intel_hpl_v3 (+ uncore and
# env knobs, N up to ~329k) -> smac3_intel_hpl_fast (same space, N back to
# ~89k-97k so each run takes ~2-3 min). On first start the run group is
# seeded with the finished smac3_intel_hpl_v3 runs whose N fits this band
# (larger-N runs are skipped); older runs carry Intel's env defaults and
# UNCORE_MAX_MHZ=2500 (2.5 GHz default or a 2.0 GHz cap, which measured
# identical). Resumes from outputs/autotuning/<run_group>/ on restart.
# Confirm winners at large N separately (scripts/Launchpad/hpl/system_ab.sh -n).

experiment:
  name: hpl-intel-launchpad-smac3
  optimizer: smac3
  run_group: smac3_intel_hpl_fast
  budget: 1000000000
  seed: 42
  priors: outputs/autotuning/smac3_intel_hpl_v3/evaluations.jsonl

objective:
  metric: gflops
  direction: maximize

application:
  type: hpl_intel
  # Resolved by hpl_smac3.sh from spack's intel-oneapi-mkl.
  executable: ${INTEL_HPL_EXE}
  # N is tuned over [0.059, 0.069] of total RAM (1007 GiB): N ~= 89k-97k
  # (~65-75 GiB matrix, ~2-3 min per run at the best configs). The full range
  # used before was [0.059, 0.80] (N up to ~329k, ~1.5 h per run).
  node_memory_bytes: 1007GiB
  memory_factor: 1.0
  memory_fraction_bounds: [0.059, 0.069]
  tunable:
    - N
    - NB          # 256-2048 (Intel recommends 1536 on 4th-gen Xeon Scalable)
    - PMAP
    - PFACT
    - NBMIN
    - NDIV
    - RFACT
    - BCAST
    - DEPTH
    - SWAP
    - L1
    - U
    - EQUIL
    - GRID        # 1x1 | 1x2 | 2x1 (HPL_HOST_NODE) | 2x2 1x4 4x1 2x4 4x2 (HPL_HOST_CORE)
    - MEM_POLICY  # default | interleave (numactl --interleave=all)
    - UNCORE_MAX_MHZ  # 2500 (default) 2000 1600 1400 1200 1000 800; set per job, restored after
    - HPL_HT             # 0 | 1 (also use each core's 2nd hyperthread)
    - HPL_NUMTHREADS     # all | -1 | -2 | -4 | 3/4 | 1/2 (threads per rank)
    - HPL_PAIR           # 1 2 4 8
    - HPL_UMODE          # 1 2 (only matters with HPL_PAIR > 1)
    - HPL_SWAPWIDTH      # 64 128 192
    - HPL_SWAPTHRESHOLD  # 0 25 50 75 100 (%)
    - HPL_LARGEPAGE      # -1 THP off | 0 THP | 1 hugetlbfs (job reserves pages, restores after)
  fixed:
    SWAP_THRESH: 64
    ALIGN: 8
    HPL_LOG: 2        # most informative: all column roots + start/end times

# Reused by the local scheduler: time is the per-run wall limit (runs over it
# are killed and recorded as TIMEOUT). The slowest small-N configs took ~10 min.
slurm:
  nodes: 1
  ntasks: 2
  time: "00:30:00"
  submit_retries: 3
